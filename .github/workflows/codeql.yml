name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "24 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-5f12.yml@6e23f410e573343bea44bba58800ecde2059ebab
    with:
      execution_profile: balanced
      owner: djconnect-music-dj/djconnect

  analyze:
    uses: ./.github/workflows/djconnect-codeql-ci.yml
    with:
      languages: python
